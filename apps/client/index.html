<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>life-multi</title>
  </head>
  <body>
    <header>
      <span id="you"></span>
      <span id="status">connecting…</span>
      <span id="generation"></span>
      <button id="tutorial-open" type="button">Tutorial</button>
      <button id="leaderboard-open" type="button">Leaderboard</button>
    </header>
    <main class="stage">
      <canvas id="board"></canvas>
      <canvas id="minimap" hidden></canvas>
    </main>
    <div class="controls">
      <button id="join" hidden>Join the game</button>
      <div id="player" hidden>
        <span
          class="stat"
          title="Cells ready to place. The ring fills as the next one is earned."
        >
          <svg class="ring" viewBox="0 0 20 20" aria-hidden="true">
            <circle class="ring-track" cx="10" cy="10" r="8" />
            <circle
              id="inventory-ring"
              class="ring-fill"
              cx="10"
              cy="10"
              r="8"
              pathLength="1"
            />
          </svg>
          <span id="inventory"></span>
        </span>
        <span id="mat-stat" class="stat">
          <svg class="ring" viewBox="0 0 20 20" aria-hidden="true">
            <circle class="ring-track" cx="10" cy="10" r="8" />
            <circle
              id="mat-ring"
              class="ring-fill"
              cx="10"
              cy="10"
              r="8"
              pathLength="1"
            />
          </svg>
          <span id="mat-size"></span>
        </span>
        <span id="alive"></span>
        <button id="place" disabled>Place 0</button>
        <button id="clear">Clear</button>
        <button id="blueprints-open">Blueprints</button>
        <button id="stamp-rotate" hidden>Rotate</button>
        <button id="stamp-flip" hidden>Flip</button>
        <button id="stamp-cancel" hidden>Cancel blueprint</button>
        <button id="home">My mat</button>
      </div>
    </div>
    <dialog id="blueprints">
      <div class="dialog-body">
        <section class="library">
          <h2>Blueprints</h2>
          <ul id="blueprint-list"></ul>
        </section>
        <section class="editor">
          <h2 id="editor-title">New blueprint</h2>
          <canvas id="editor-canvas"></canvas>
          <div class="editor-tools">
            <input id="blueprint-name" placeholder="Name" />
            <span id="editor-count" class="meta"></span>
          </div>
          <div class="editor-tools">
            <button id="editor-rotate" type="button">Rotate</button>
            <button id="editor-flip" type="button">Flip</button>
            <button id="editor-clear" type="button">Clear</button>
            <button id="editor-save" type="button">Save</button>
            <button id="editor-use" type="button">Use</button>
          </div>
          <details class="rle">
            <summary>Paste or copy RLE</summary>
            <textarea
              id="rle-text"
              rows="4"
              spellcheck="false"
              autocapitalize="off"
              autocorrect="off"
              autocomplete="off"
              placeholder="x = 3, y = 3, rule = B3/S23&#10;bo$2bo$3o!"
            ></textarea>
            <div class="editor-tools">
              <button id="rle-paste" type="button" hidden>
                Paste from clipboard
              </button>
              <button id="rle-import" type="button">Import</button>
              <button id="rle-copy" type="button">Copy this drawing</button>
            </div>
          </details>
          <p id="editor-message" class="hint"></p>
        </section>
      </div>
      <form method="dialog" class="dialog-actions">
        <button>Close</button>
      </form>
    </dialog>
    <dialog id="leaderboard">
      <h2>Leaderboard</h2>
      <ol id="leaderboard-list"></ol>
      <p id="leaderboard-rank" class="meta"></p>
      <form id="name-form" hidden>
        <label for="player-name">Your name</label>
        <input
          id="player-name"
          autocomplete="nickname"
          enterkeyhint="done"
          placeholder="unnamed"
        />
        <button type="submit">Save</button>
      </form>
      <p id="leaderboard-message" class="hint"></p>
      <form method="dialog" class="dialog-actions">
        <button>Close</button>
      </form>
    </dialog>
    <dialog id="tutorial">
      <div class="tutorial-body">
        <div class="tutorial-board">
          <canvas id="tutorial-canvas"></canvas>
          <div id="tutorial-simulation" class="editor-tools">
            <button id="tutorial-play" type="button">Pause</button>
            <button id="tutorial-step" type="button">Step</button>
            <button id="tutorial-reset" type="button">Reset</button>
            <span id="tutorial-generation" class="meta"></span>
          </div>
          <div id="tutorial-patterns" class="editor-tools"></div>
        </div>
        <section class="tutorial-text">
          <p id="tutorial-progress" class="meta"></p>
          <h2 id="tutorial-title"></h2>
          <div id="tutorial-copy"></div>
          <ul id="tutorial-tasks"></ul>
          <div id="tutorial-stats" class="tutorial-stats" hidden></div>
          <p id="tutorial-message" class="hint"></p>
        </section>
      </div>
      <div class="dialog-actions">
        <button id="tutorial-close" type="button">Close</button>
        <button id="tutorial-back" type="button">Back</button>
        <button id="tutorial-next" type="button">Next</button>
      </div>
    </dialog>
    <p id="message" class="hint">
      Wheel to zoom, right-drag or WASD to pan. Select empty squares on your
      mat, then press Place (Enter).
    </p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
