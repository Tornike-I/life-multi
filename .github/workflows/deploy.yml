name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Authorize the deploy key
        env:
          SSH_KEY: ${{ secrets.LIFE_MULTI_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIFE_MULTI_KNOWN_HOSTS }}
        run: |
          # Without a known_hosts entry the host key is accepted unseen, which
          # would let anything answering on that address take the deploy.
          if [[ -z "$KNOWN_HOSTS" ]]; then
            echo "LIFE_MULTI_KNOWN_HOSTS is not set. See docs/hosting.md." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/life-multi
          chmod 600 ~/.ssh/life-multi
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
      - name: Deploy main
        env:
          LIFE_MULTI_HOST: ${{ secrets.LIFE_MULTI_HOST }}
          LIFE_MULTI_ASSUME_YES: 1
        run: scripts/deploy.sh
      - name: Forget the deploy key
        if: always()
        run: rm -f ~/.ssh/life-multi
